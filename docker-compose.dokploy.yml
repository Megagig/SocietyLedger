# Production stack for Dokploy (Docker Compose project type).
#
# Deploy as a single Dokploy "Compose" application pointed at this file.
# All ${VARS} below are injected by Dokploy's project-level Environment tab —
# see context/architecture.md / docs/deployment/DOKPLOY_MIGRATION.md for the full list.
#
# Dokploy manages Traefik for you; the `dokploy.*` labels below just tell it
# which domain(s)/port to route to each service. Adjust the domain names to
# match what you configure in the Dokploy UI (or keep as the source of truth
# if you prefer managing domains purely via compose labels).

services:
  postgres:
    image: postgres:16-alpine
    container_name: societyledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: societyledger-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: societyledger-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}
      NOMBA_API_KEY: ${NOMBA_API_KEY}
      NOMBA_API_SECRET: ${NOMBA_API_SECRET}
      NOMBA_ACCOUNT_ID: ${NOMBA_ACCOUNT_ID}
      NOMBA_WEBHOOK_SECRET: ${NOMBA_WEBHOOK_SECRET}
      NOMBA_BASE_URL: ${NOMBA_BASE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      BASE_DOMAIN: ${BASE_DOMAIN}
      ADMIN_URL: ${ADMIN_URL}
      PLATFORM_TOKEN_EXPIRY: ${PLATFORM_TOKEN_EXPIRY:-8h}
      # AES-256-GCM key for TOTP secret encryption — generate with:
      # openssl rand -hex 32
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
    volumes:
      - api_uploads:/app/apps/api/uploads
    networks:
      - internal
      - dokploy-network
    labels:
      - "dokploy.domain=${API_DOMAIN}"
      - "dokploy.port=4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
        NEXT_PUBLIC_BASE_DOMAIN: ${NEXT_PUBLIC_BASE_DOMAIN}
    container_name: societyledger-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
      NEXT_PUBLIC_BASE_DOMAIN: ${NEXT_PUBLIC_BASE_DOMAIN}
    networks:
      - dokploy-network
    labels:
      # Wildcard rule so every tenant subdomain (e.g. ogunstate.societyledger.com.ng)
      # and the apex domain both route here.
      # TLS: wildcard cert *.societyledger.com.ng is issued via DNS-01 (HTTP-01
      # cannot issue wildcard certs). Requires CF_DNS_API_TOKEN env var in the
      # Dokploy Traefik settings and the letsencrypt certresolver configured with
      # dnsChallenge provider=cloudflare — see docs/deployment/DOKPLOY_MIGRATION.md.
      - "traefik.enable=true"
      # Traefik v3 HostRegexp takes a plain Go regexp (v2 named-group syntax
      # {subdomain:pattern} was removed in v3 and causes the router to be rejected).
      - "traefik.http.routers.societyledger-web.rule=Host(`${BASE_DOMAIN}`) || HostRegexp(`[a-zA-Z0-9-]+\\.${BASE_DOMAIN}`)"
      - "traefik.http.routers.societyledger-web.entrypoints=websecure"
      - "traefik.http.routers.societyledger-web.tls=true"
      - "traefik.http.routers.societyledger-web.tls.certresolver=letsencrypt"
      # Tell Traefik which names to include in the wildcard cert request.
      # Without these, Traefik can't infer the domains from a HostRegexp pattern.
      - "traefik.http.routers.societyledger-web.tls.domains[0].main=${BASE_DOMAIN}"
      - "traefik.http.routers.societyledger-web.tls.domains[0].sans[0]=*.${BASE_DOMAIN}"
      - "traefik.http.services.societyledger-web.loadbalancer.server.port=3000"
      # Explicitly bind this router to our service — prevents the "cannot be linked
      # automatically with multiple Services" error when old Dokploy containers from
      # previous deploys are still running with auto-generated service names.
      - "traefik.http.routers.societyledger-web.service=societyledger-web"
      # Health check — Traefik only routes to backends that pass this check,
      # so stale containers from old deploys are automatically excluded.
      - "traefik.http.services.societyledger-web.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.societyledger-web.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.societyledger-web.loadbalancer.healthcheck.timeout=5s"
      # Below docs' priority (100) — without this, Traefik's rule-length tiebreak
      # could let this wildcard capture docs.${BASE_DOMAIN}, since HostRegexp also
      # matches it. Fixed at D1.7, when docs (the first service needing explicit
      # priority) actually landed — architecture.md §17.3 flagged this gap when web
      # shipped, before admin/docs existed to need it.
      - "traefik.http.routers.societyledger-web.priority=1"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_ADMIN_HOST: ${NEXT_PUBLIC_ADMIN_HOST}
        NEXT_PUBLIC_ENV: ${NEXT_PUBLIC_ENV:-production}
    container_name: societyledger-admin
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      # Server-side only — the BFF uses this to reach the API internally
      API_URL: http://societyledger-api:4000
      BASE_DOMAIN: ${BASE_DOMAIN}
      NEXT_PUBLIC_ADMIN_HOST: ${NEXT_PUBLIC_ADMIN_HOST}
      NEXT_PUBLIC_ENV: ${NEXT_PUBLIC_ENV:-production}
      # Optional IP allowlist (comma-separated) — leave empty to disable
      ADMIN_IP_ALLOWLIST: ${ADMIN_IP_ALLOWLIST:-}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/api/health',function(r){process.exit(r.statusCode<400?0:1)}).on('error',function(){process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      # Needs internal so the BFF can reach societyledger-api without going
      # through the public internet (API_URL = http://societyledger-api:4000)
      - internal
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.societyledger-admin.rule=Host(`${ADMIN_DOMAIN}`)"
      - "traefik.http.routers.societyledger-admin.entrypoints=websecure"
      - "traefik.http.routers.societyledger-admin.tls=true"
      - "traefik.http.routers.societyledger-admin.tls.certresolver=letsencrypt"
      # Priority 100 — same as docs; both beat the web wildcard (priority 1) so
      # admin.${BASE_DOMAIN} routes here, not to the tenant-subdomain HostRegexp.
      - "traefik.http.routers.societyledger-admin.priority=100"
      - "traefik.http.services.societyledger-admin.loadbalancer.server.port=3002"
      - "traefik.http.routers.societyledger-admin.service=societyledger-admin"
      - "traefik.http.services.societyledger-admin.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.societyledger-admin.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.societyledger-admin.loadbalancer.healthcheck.timeout=5s"

  docs:
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
      args:
        # Bare NEXT_PUBLIC_* names, matching web's own convention above (it
        # doesn't prefix its build args either) — no collision risk, these
        # three names belong to docs alone.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID}
        NEXT_PUBLIC_SHOW_DRAFTS: ${NEXT_PUBLIC_SHOW_DRAFTS}
    container_name: societyledger-docs
    restart: unless-stopped
    environment:
      # Set to "noindex, nofollow" on the staging deployment's Dokploy environment
      # variables only — leave unset here so production (this same compose file,
      # deployed separately for the `main` branch) sends no header at all.
      ROBOTS_TAG: ${DOCS_ROBOTS_TAG}
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.societyledger-docs.rule=Host(`${DOCS_DOMAIN}`)"
      - "traefik.http.routers.societyledger-docs.entrypoints=websecure"
      - "traefik.http.routers.societyledger-docs.tls=true"
      - "traefik.http.routers.societyledger-docs.tls.certresolver=letsencrypt"
      # Above the web wildcard (priority 1) so docs.${BASE_DOMAIN} resolves here,
      # not to web's HostRegexp tenant-subdomain rule (architecture.md §17.3).
      - "traefik.http.routers.societyledger-docs.priority=100"
      - "traefik.http.services.societyledger-docs.loadbalancer.server.port=80"
      - "traefik.http.routers.societyledger-docs.service=societyledger-docs"
      - "traefik.http.services.societyledger-docs.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.societyledger-docs.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.societyledger-docs.loadbalancer.healthcheck.timeout=5s"

networks:
  internal:
    driver: bridge
  # Dokploy attaches every app it manages to this shared network so its Traefik
  # instance can reach them. It already exists on a Dokploy host — do not create it.
  dokploy-network:
    external: true

volumes:
  pgdata:
  redisdata:
  api_uploads:
