# Production stack for Dokploy (Docker Compose project type).
#
# Deploy as a single Dokploy "Compose" application pointed at this file.
# All ${VARS} below are injected by Dokploy's project-level Environment tab —
# see context/architecture.md / docs/deployment/DOKPLOY_MIGRATION.md for the full list.
#
# Dokploy manages Traefik for you; the `dokploy.*` labels below just tell it
# which domain(s)/port to route to each service. Adjust the domain names to
# match what you configure in the Dokploy UI (or keep as the source of truth
# if you prefer managing domains purely via compose labels).

services:
  postgres:
    image: postgres:16-alpine
    container_name: societyledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: societyledger-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: societyledger-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}
      NOMBA_API_KEY: ${NOMBA_API_KEY}
      NOMBA_API_SECRET: ${NOMBA_API_SECRET}
      NOMBA_ACCOUNT_ID: ${NOMBA_ACCOUNT_ID}
      NOMBA_WEBHOOK_SECRET: ${NOMBA_WEBHOOK_SECRET}
      NOMBA_BASE_URL: ${NOMBA_BASE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      BASE_DOMAIN: ${BASE_DOMAIN}
      ADMIN_URL: ${ADMIN_URL}
      PLATFORM_TOKEN_EXPIRY: ${PLATFORM_TOKEN_EXPIRY:-8h}
      # AES-256-GCM key for TOTP secret encryption — generate with:
      # openssl rand -hex 32
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
    volumes:
      - api_uploads:/app/apps/api/uploads
    networks:
      - internal
      - dokploy-network
    labels:
      - "dokploy.domain=${API_DOMAIN}"
      - "dokploy.port=4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
        NEXT_PUBLIC_BASE_DOMAIN: ${NEXT_PUBLIC_BASE_DOMAIN}
    container_name: societyledger-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
      NEXT_PUBLIC_BASE_DOMAIN: ${NEXT_PUBLIC_BASE_DOMAIN}
    networks:
      - dokploy-network
    labels:
      # The apex domain (societyledger.com.ng) is already handled by Dokploy's own
      # native Domains tab (Dokploy → this app → Domains), which generates its own
      # Traefik routing independent of these Docker labels and has worked reliably
      # the whole time (same mechanism api/admin/docs/web all use there). We found,
      # after a long debugging session, that our own hand-written traefik.http.*
      # labels for the apex domain were a SECOND, PARALLEL routing config for the
      # exact same hostname — fighting Dokploy's native one. That's what caused the
      # repeated "cannot be linked automatically with multiple Services" errors and
      # the phantom "v1dsnv-*" service names (artifacts of Dokploy's own generated
      # config, not leftover containers — docker ps/docker service ls never showed
      # them because they were never real containers).
      #
      # So this router ONLY matches actual tenant subdomains (requires a literal
      # "." before the base domain) — never the apex — so it can never overlap with
      # Dokploy's native "web" domain entry. This is the one thing Dokploy's simple
      # per-domain UI can't do (wildcard subdomains), so it's the only piece of
      # custom Traefik config this app still needs.
      - "traefik.enable=true"
      - "traefik.http.routers.sl-tenant-http.rule=HostRegexp(`[a-zA-Z0-9-]+\\.${BASE_DOMAIN}`)"
      - "traefik.http.routers.sl-tenant-http.entrypoints=web"
      - "traefik.http.routers.sl-tenant-http.middlewares=sl-redirect-to-https"
      - "traefik.http.routers.sl-tenant-http.service=sl-tenant"
      - "traefik.http.routers.sl-tenant-http.priority=1"
      - "traefik.http.middlewares.sl-redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.sl-redirect-to-https.redirectscheme.permanent=true"
      # Traefik v3 HostRegexp takes a plain Go regexp (v2 named-group syntax
      # {subdomain:pattern} was removed in v3 and causes the router to be rejected).
      - "traefik.http.routers.sl-tenant.rule=HostRegexp(`[a-zA-Z0-9-]+\\.${BASE_DOMAIN}`)"
      - "traefik.http.routers.sl-tenant.entrypoints=websecure"
      - "traefik.http.routers.sl-tenant.tls=true"
      - "traefik.http.routers.sl-tenant.tls.certresolver=letsencrypt"
      # Tell Traefik which names to include in the wildcard cert request. The apex
      # domain's own cert is issued separately by Dokploy's native "web" domain
      # entry, so this only needs the wildcard SAN.
      - "traefik.http.routers.sl-tenant.tls.domains[0].main=*.${BASE_DOMAIN}"
      - "traefik.http.services.sl-tenant.loadbalancer.server.port=3000"
      - "traefik.http.routers.sl-tenant.service=sl-tenant"
      - "traefik.http.routers.sl-tenant.priority=1"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_ADMIN_HOST: ${NEXT_PUBLIC_ADMIN_HOST}
        NEXT_PUBLIC_ENV: ${NEXT_PUBLIC_ENV:-production}
    container_name: societyledger-admin
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      # Server-side only — the BFF uses this to reach the API internally
      API_URL: http://societyledger-api:4000
      BASE_DOMAIN: ${BASE_DOMAIN}
      NEXT_PUBLIC_ADMIN_HOST: ${NEXT_PUBLIC_ADMIN_HOST}
      NEXT_PUBLIC_ENV: ${NEXT_PUBLIC_ENV:-production}
      # Optional IP allowlist (comma-separated) — leave empty to disable
      ADMIN_IP_ALLOWLIST: ${ADMIN_IP_ALLOWLIST:-}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/api/health',function(r){process.exit(r.statusCode<400?0:1)}).on('error',function(){process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      # Needs internal so the BFF can reach societyledger-api without going
      # through the public internet (API_URL = http://societyledger-api:4000)
      - internal
      - dokploy-network
    labels:
      # Routed via Dokploy's native Domains tab (admin.${BASE_DOMAIN} → port 3002),
      # same mechanism as api below — no hand-written traefik.* labels needed. See
      # the long comment on the web service's labels for why we stopped hand-writing
      # these for domains Dokploy already manages natively.
      - "dokploy.domain=${ADMIN_DOMAIN}"
      - "dokploy.port=3002"

  docs:
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
      args:
        # Bare NEXT_PUBLIC_* names, matching web's own convention above (it
        # doesn't prefix its build args either) — no collision risk, these
        # three names belong to docs alone.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID}
        NEXT_PUBLIC_SHOW_DRAFTS: ${NEXT_PUBLIC_SHOW_DRAFTS}
    container_name: societyledger-docs
    restart: unless-stopped
    environment:
      # Set to "noindex, nofollow" on the staging deployment's Dokploy environment
      # variables only — leave unset here so production (this same compose file,
      # deployed separately for the `main` branch) sends no header at all.
      ROBOTS_TAG: ${DOCS_ROBOTS_TAG}
    networks:
      - dokploy-network
    labels:
      # Routed via Dokploy's native Domains tab (docs.${BASE_DOMAIN} → port 80),
      # same mechanism as api/admin — no hand-written traefik.* labels needed. See
      # the long comment on the web service's labels for why.
      - "dokploy.domain=${DOCS_DOMAIN}"
      - "dokploy.port=80"

networks:
  internal:
    driver: bridge
  # Dokploy attaches every app it manages to this shared network so its Traefik
  # instance can reach them. It already exists on a Dokploy host — do not create it.
  dokploy-network:
    external: true

volumes:
  pgdata:
  redisdata:
  api_uploads:
