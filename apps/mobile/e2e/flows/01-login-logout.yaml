appId: ${APP_ID}
env:
  EMAIL: ${MEMBER_EMAIL}
---
- runFlow:
    file: ../subflows/login.yaml
- assertVisible: Home
- tapOn: Profile
- scrollUntilVisible:
    element:
      id: profile-sign-out
- tapOn:
    id: profile-sign-out
# Sign-out may ask to confirm.
- runFlow:
    when:
      visible: Sign out
    commands:
      - tapOn: Sign out
- assertVisible: Get started
