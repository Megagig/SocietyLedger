services:
  - type: web
    name: societyledger-api
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install && cd apps/api && npx prisma generate && npm run build
    preDeployCommand: cd apps/api && npx prisma migrate deploy
    startCommand: npm start --workspace=apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BASE_DOMAIN
        value: societyledger.com.ng
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: SocietyLedger <admin@megagigsolution.com>
      - key: EMAIL_REPLY_TO
        value: admin@megagigsolution.com
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: NOMBA_API_KEY
        sync: false
      - key: NOMBA_API_SECRET
        sync: false
      - key: NOMBA_ACCOUNT_ID
        sync: false
      - key: NOMBA_WEBHOOK_SECRET
        sync: false
      - key: NOMBA_BASE_URL
        value: https://api.nomba.com/v1
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_SECRET_KEY
        sync: false
      - key: TERMII_SENDER_ID
        value: SocietyLedger
      - key: OPENROUTER_API_KEY
        sync: false
      - key: RBAC_CACHE_TTL
        value: 300000
      - key: RBAC_AUDIT_ENABLED
        value: true
      - key: REDIS_URL
        sync: false
